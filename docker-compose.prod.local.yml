services:
  backend: &backend
    build:
      context: .
      dockerfile: ./backend/Dockerfile.prod
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    restart: unless-stopped
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - seo_volume:/home/app/backend/seofiles
    expose:
      - 8000
    env_file:
      - ./.env.prod.local
    depends_on:
      backend_db:
        condition: service_healthy
      redis:
        condition: service_healthy

  backend_db:
    image: postgres:15
    restart: unless-stopped
    env_file:
      - ./.env.prod.local
    volumes:
      - backend_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6.2.11-alpine
    command: redis-server  --appendonly yes  --appendfsync everysec  --save 60 1  --loglevel notice
    expose:
      - 6379
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  celery:
    <<: *backend
    command: celery -A config worker --loglevel=info -n worker1
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []

  celery-beat:
    <<: *backend
    command: celery -A config beat
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    entrypoint: []
    ports: []

  nginx:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile.prod.local
      args:
        VITE_APP_BUILD_VERSION: ${VITE_APP_BUILD_VERSION}
    restart: unless-stopped
    volumes:
      - static_volume:/home/app/backend/staticfiles
      - media_volume:/home/app/backend/mediafiles
      - seo_volume:/usr/share/nginx/html/seo
    depends_on:
      backend:
        condition: service_started
      umami:
        condition: service_started
    ports:
      - 80:80
      - 5432:5432
      - 443:443
    env_file:
      - ./.env.prod.local

  umami:
    build:
      context: .
      dockerfile: ./umami/Dockerfile
      args:
        BASE_PATH: ${UMAMI_BASE_PATH}
        DATABASE_TYPE: ${UMAMI_DATABASE_TYPE}
    environment:
      DATABASE_URL: ${UMAMI_DATABASE_URL}
      HASH_SALT: ${UMAMI_HASH_SALT}
      APP_SECRET: ${UMAMI_APP_SECRET}
      BASE_PATH: ${UMAMI_BASE_PATH}
      DATABASE_TYPE: ${UMAMI_DATABASE_TYPE}
      TRACKER_SCRIPT_NAME: ${UMAMI_TRACKER_SCRIPT_NAME}
      COLLECT_API_ENDPOINT: ${UMAMI_COLLECT_API_ENDPOINT}
      #FORCE_SSL: ${UMAMI_FORCE_SSL}
    depends_on:
      umami_db:
        condition: service_healthy
    env_file:
      - ./.env.prod.local
    expose:
      - 3000
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:3000/api/heartbeat" ]
      interval: 5s
      timeout: 5s
      retries: 5

  umami_db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${UMAMI_POSTGRES_DB}
      POSTGRES_USER: ${UMAMI_POSTGRES_USER}
      POSTGRES_PASSWORD: ${UMAMI_POSTGRES_PASSWORD}
    volumes:
      - umami_db_data:/var/lib/postgresql/data/
    env_file:
      - ./.env.prod.local
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${UMAMI_POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  chrome:
    image: zenika/alpine-chrome:124
    command:
      - "chromium-browser"
      - "--headless"
      - "--no-sandbox"
      - "--disable-dev-shm-usage"
      - "--disable-gpu"
      - "--remote-debugging-port=9222"
      - "--remote-debugging-address=0.0.0.0"
      - "--enable-features=ConversionMeasurement,AttributionReportingCrossAppWeb"
    expose:
      - 9222
    restart: unless-stopped

volumes:
  backend_db_data:
  umami_db_data:
  static_volume:
  media_volume:
  seo_volume:
  redis_data:
